<!DOCTYPE html>
<html>
<head>
    <title>Flashcard Game</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
        }

        .card {
            width: 400px;
            height: 200px;
            perspective: 1000px;
            margin-bottom: 100px;
        }

        .inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 2px 2px 10px #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backface-visibility: hidden;
            background: white;
        }

        .front {
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            transform: rotateY(180deg);
            flex-direction: column;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>


<div class="container">
