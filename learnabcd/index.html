<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alphabet Fun!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      background: linear-gradient(135deg, #fff3c4, #ffd9e8 55%, #d9f3ff);
      color: #29324a;
    }
    .game {
      width: min(100%, 620px);
      text-align: center;
      background: rgba(255,255,255,.92);
      border: 5px solid white;
      border-radius: 32px;
      padding: clamp(24px, 6vw, 48px);
      box-shadow: 0 16px 40px rgba(62, 67, 105, .14);
    }
    h1 {
      margin: 0 0 8px;
      color: #7356c8;
      font-size: clamp(2rem, 7vw, 3.2rem);
    }
    .subtitle {
      margin: 0 0 22px;
      font-size: clamp(1rem, 3vw, 1.25rem);
    }
    .letter-card {
      min-height: 280px;
      display: grid;
      place-items: center;
      margin: 12px 0 26px;
      border-radius: 26px;
      background: #f0eaff;
      border: 3px dashed #b8a4f3;
    }
    #letter {
      font-size: clamp(9rem, 35vw, 16rem);
      line-height: 1;
      font-weight: 900;
      color: #5c48bb;
      text-shadow: 4px 5px 0 rgba(92,72,187,.12);
      user-select: none;
    }
    button {
      border: 0;
      border-radius: 18px;
      padding: 17px 28px;
      font: inherit;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    button:hover { filter: brightness(1.04); transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 4px solid #29324a; outline-offset: 4px; }
    #nextButton { background: #ff9f43; color: #38220b; box-shadow: 0 5px 0 #dc7c27; }
    .hint { margin: 22px 0 0; color: #687089; font-size: .95rem; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🌈 Alphabet Fun! 🌈</h1>
    <p class="subtitle">What letter is this?</p>
    <div class="letter-card" aria-live="polite" aria-atomic="true">
      <span id="letter">A</span>
    </div>
    <button id="nextButton" type="button">🎲 Next Letter!</button>
    <p class="hint">Say the letter out loud together!</p>
  </main>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const letterDisplay = document.getElementById("letter");
    const nextButton = document.getElementById("nextButton");
    let previousLetter = "A";

    function showRandomLetter() {
      let nextLetter;
      do {
        nextLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
      } while (alphabet.length > 1 && nextLetter === previousLetter);

      previousLetter = nextLetter;
      letterDisplay.textContent = nextLetter;
    }

    nextButton.addEventListener("click", showRandomLetter);
  </script>
</body>
</html>
